services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blackdragon
      POSTGRES_USER: blackdragon
      POSTGRES_PASSWORD: blackdragon_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackdragon"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://blackdragon:blackdragon_dev@postgres:5432/blackdragon
      SECRET_KEY: dev-secret-key-change-in-production
      FERNET_KEY: dev-fernet-key-change-in-production-32b=
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
